    <script>
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(20260918);
      var starsSvg = document.getElementById('bg-stars');
      var starsFrag = '';
      for (var i = 0; i < 40; i++) {
        var cx = Math.round(rand() * 1080);
        var cy = Math.round(rand() * 1920);
        var r = (1.5 + rand() * 1.5).toFixed(2);
        var op = (0.15 + rand() * 0.25).toFixed(2);
        starsFrag += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" opacity="' + op + '"></circle>';
      }
      starsSvg.innerHTML = starsFrag;

      const tl = gsap.timeline({ paused: true });
      tl.to('#bg-depth .blob1', { x: '+=40', y: '-=30', duration: 18, ease: 'sine.inOut', repeat: 20, yoyo: true }, 0);
      tl.to('#bg-depth .blob2', { x: '+=40', y: '-=30', duration: 18, ease: 'sine.inOut', repeat: 20, yoyo: true }, 3);
      tl.to('#bg-depth .blob3', { x: '+=40', y: '-=30', duration: 18, ease: 'sine.inOut', repeat: 20, yoyo: true }, 6);
      tl.to('#bg-stars circle', { opacity: '+=0.2', duration: 4, ease: 'sine.inOut', repeat: 20, yoyo: true, stagger: { each: 0.15, from: 'random' } }, 0);
      tl.set('#brand-anchor', { opacity: 1 }, 7.48);
      window.__timelines['main'] = tl;
